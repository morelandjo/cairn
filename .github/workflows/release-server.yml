name: Release Server

on:
  push:
    tags: ["v*"]

concurrency:
  group: release-server-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docker:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - component: server
            context: ./server
            dockerfile: ./server/Dockerfile
          - component: sfu
            context: ./sfu
            dockerfile: ./sfu/Dockerfile
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        if: matrix.component == 'server'
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Set up Rust (for proto WASM build)
        if: matrix.component == 'server'
        run: rustup target add wasm32-unknown-unknown && cargo install wasm-bindgen-cli

      - name: Build web client
        if: matrix.component == 'server'
        run: |
          (cd proto && npm ci && npm run build)
          (cd client/web && npm ci && npm run build)
          mkdir -p server/priv/static/app
          cp -r client/web/dist/* server/priv/static/app/

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract version from tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          build-args: |
            APP_VERSION=${{ steps.version.outputs.version }}
          # arm64 disabled: mediasoup C++ worker takes hours under QEMU emulation
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/morelandjo/cairn-${{ matrix.component }}:${{ steps.version.outputs.version }}
            ghcr.io/morelandjo/cairn-${{ matrix.component }}:latest
          labels: |
            org.opencontainers.image.title=cairn-${{ matrix.component }}
            org.opencontainers.image.description=Cairn ${{ matrix.component }} — privacy-first federated communication
            org.opencontainers.image.version=${{ steps.version.outputs.version }}
            org.opencontainers.image.source=https://github.com/morelandjo/cairn
            org.opencontainers.image.licenses=AGPL-3.0
          cache-from: type=gha
          cache-to: type=gha,mode=max
